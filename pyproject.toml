[project]
name = "TADRED"
version = "1.0.0"
dependencies = [
    "numpy",
    "torch",
    "torchvision",
    "torchaudio",
    "pyyaml",
    "hydra-core",
]

[project.scripts]
train_eval__tadred = "tadred.tadred_main:train_and_eval"
run = "tadred.tadred_main:run"

[build-system]
requires = ["setuptools", "setuptools_scm[toml]>=6.2", "wheel"]

[tool.setuptools.packages.find]
include = ["tadred*"]
